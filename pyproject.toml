[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tesseralm"
version = "1.0.0"
description = "A tiny decoder-only Transformer language model with local browser chat"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2.0"]
license = { file = "LICENSE" }

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["model*", "tokenizer*", "training*", "inference*", "quantization*", "ui*"]
